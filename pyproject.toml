[project]
name = "rigger"
version = "0.1.0"
description = "Agente que transforma material de curso de içamento de carga em treinamentos (PPTX) e apreciações de risco (Word), ancorado em NRs e ABNT."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.69",
    "python-pptx>=1.0",
    "python-docx>=1.1",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "pypdf>=4.2",
    "typer>=0.12",
]

[project.scripts]
rigger = "rigger.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
